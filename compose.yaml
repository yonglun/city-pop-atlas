name: citypop
services:
  app:
    build: .
    image: citypop-linux:${RELEASE_TAG:-20261005-v33}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    user: "${CITYPOP_UID:-1000}:${CITYPOP_GID:-1000}"
    environment:
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      CLARITY_PROJECT_ID: ${CLARITY_PROJECT_ID:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://127.0.0.1:8081}
      ADMIN_PASSWORD_FILE: /app/secrets/admin-password
    volumes:
      - ${CITYPOP_DATA_DIR:-./runtime}:/app/runtime
      - ${CITYPOP_BACKUP_DIR:-./backups}:/backups
      - ${CITYPOP_SECRETS_DIR:-./secrets}:/app/secrets:ro
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-8081}:8001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 25s
  web:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt: [no-new-privileges:true]
