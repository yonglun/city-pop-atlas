server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    # Compress public HTML, XML and text without caching authenticated content.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml text/xml image/svg+xml;
    client_max_body_size 64k;
    client_body_timeout 15s;
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header OAI-Authenticated-User-Id "";
        proxy_set_header OAI-Authenticated-User-Email "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
